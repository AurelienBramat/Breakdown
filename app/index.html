<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron Replay</title>
<style>
  :root { --bg:#0d1216; --panel:#151d23; --panel2:#1b252d; --line:#26333d; --text:#e6edf2; --mute:#8798a5; --acc:#f5b82e; --good:#3fbf7f; --warn:#e8b33a; --bad:#e5544b; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 system-ui, -apple-system, sans-serif; display:grid; grid-template:auto 1fr / 290px 1fr 360px; }
  header { grid-column:1/-1; display:flex; align-items:center; gap:16px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; letter-spacing:.04em; } header h1 span { color:var(--acc); }
  aside, main { overflow:auto; min-height:0; }
  #left { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #right { background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; }
  main { padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  select, input[type=search], button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; white-space:nowrap; } button:hover { border-color:var(--acc); }
  button.on { background:var(--acc); color:#111; border-color:var(--acc); font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }
  .muted { color:var(--mute); } .good { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  h3 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); margin:14px 0 6px; }

  /* scoreboard */
  #board { display:flex; align-items:center; gap:10px; margin-left:auto; font-weight:600; }
  .team { display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:6px; background:var(--panel2); }
  .team i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .team b { font-size:17px; } .team.poss { outline:2px solid var(--acc); }
  .sit { background:var(--panel2); padding:5px 10px; border-radius:6px; }
  .sit em { color:var(--acc); font-style:normal; }

  /* play list */
  #filters { padding:10px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--line); }
  .chips { display:flex; flex-wrap:wrap; gap:4px; } .chips button { padding:3px 9px; font-size:12px; border-radius:20px; }
  #plays { overflow:auto; flex:1; }
  .play { padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:2px 8px; }
  .play:hover { background:var(--panel2); } .play.sel { background:#24323c; box-shadow:inset 3px 0 var(--acc); }
  .play .meta { font-weight:600; } .play .d { grid-column:1/-1; color:var(--mute); font-size:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .badge { font-size:11px; font-weight:700; padding:1px 7px; border-radius:10px; background:#2d3a44; }
  .badge.gain { background:#1f4a35; color:#7ee2ac; } .badge.big { background:var(--good); color:#06180e; }
  .badge.loss { background:#4a2020; color:#ff9a92; } .badge.td { background:var(--acc); color:#111; }
  #count { font-size:12px; }

  /* field + controls */
  #stage { position:relative; }
  #field { width:100%; display:block; border-radius:10px; background:#173b22; }
  #tip { position:absolute; pointer-events:none; background:#000c; padding:4px 8px; border-radius:6px; font-size:12px; display:none; white-space:nowrap; }
  #modeBadge { position:absolute; top:10px; left:10px; display:flex; gap:0; }
  #modeBadge button { border-radius:0; background:#000a; } #modeBadge button:first-child { border-radius:7px 0 0 7px; } #modeBadge button:last-child { border-radius:0 7px 7px 0; }
  #modeBadge button.on { background:var(--acc); }
  #empty { position:absolute; inset:0; display:grid; place-items:center; color:#cfe; font-size:16px; pointer-events:none; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #play { width:46px; font-size:16px; }
  #timeline { position:relative; flex:1; min-width:240px; height:34px; }
  #scrub { width:100%; position:absolute; top:0; margin:0; accent-color:var(--acc); }
  #marks { position:absolute; top:18px; left:0; right:0; height:16px; }
  #marks span { position:absolute; transform:translateX(-50%); font-size:10px; color:var(--mute); cursor:pointer; white-space:nowrap; }
  #marks span::before { content:''; position:absolute; left:50%; top:-6px; width:1px; height:5px; background:var(--acc); }
  #clock { font-variant-numeric:tabular-nums; min-width:92px; text-align:right; }
  .toggles button { font-size:12px; padding:4px 9px; }
  .kbd { font-size:11px; }

  /* right tabs */
  #tabs { display:flex; border-bottom:1px solid var(--line); }
  #tabs button { flex:1; border:0; border-radius:0; padding:11px; background:transparent; color:var(--mute); font-weight:600; }
  #tabs button.on { color:var(--acc); background:transparent; box-shadow:inset 0 -2px var(--acc); }
  .tab { padding:12px 14px; overflow:auto; flex:1; display:none; } .tab.on { display:block; }
  .desc { font-size:14px; line-height:1.5; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; } .facts span:nth-child(odd) { color:var(--mute); }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:10px; margin-top:8px; }
  .barrow { display:grid; grid-template-columns:90px 1fr 38px; align-items:center; gap:6px; margin:4px 0; }
  .barrow i { display:block; height:8px; background:#3a4954; border-radius:4px; } .barrow i b { display:block; height:100%; background:var(--acc); border-radius:4px; }
  .barrow.this span:first-child { color:var(--acc); font-weight:700; }

  /* what-if */
  .step { margin-bottom:14px; } .step > b { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .step > b i { width:20px; height:20px; border-radius:50%; background:var(--acc); color:#111; font-style:normal; display:grid; place-items:center; font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; } .grid button { padding:7px 4px; }
  .recv { display:flex; flex-direction:column; gap:4px; }
  .recv button { text-align:left; display:flex; justify-content:space-between; }
  .recv button small { color:inherit; opacity:.7; }
  .cov button { display:block; width:100%; text-align:left; margin-bottom:4px; } .cov small { display:block; opacity:.75; font-weight:400; }
  .res { display:grid; grid-template-columns:1fr auto auto; gap:4px 10px; align-items:center; }
  .verdict { font-size:11px; font-weight:700; padding:1px 7px; border-radius:10px; }
  .verdict.open { background:var(--good); color:#06180e; } .verdict.tight { background:var(--warn); color:#111; } .verdict.covered { background:var(--bad); color:#fff; }
  .headline { font-size:15px; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>GRIDIRON <span>REPLAY</span></h1>
  <select id="game"></select>
  <div id="board"></div>
</header>

<aside id="left">
  <div id="filters">
    <input id="search" type="search" placeholder="Search player, route, coverage…">
    <div class="chips" id="chips"></div>
    <div class="chips" id="offChips"></div>
    <span id="count" class="muted"></span>
  </div>
  <div id="plays"></div>
</aside>

<main>
  <div id="stage">
    <canvas id="field"></canvas>
    <div id="modeBadge" hidden><button data-m="real">Original</button><button data-m="sim">What-if</button></div>
    <div id="empty">← Pick a play to start</div>
    <div id="tip"></div>
  </div>
  <div class="row">
    <button id="prev" title="Previous play (P)">⏮</button>
    <button id="play" title="Play / pause (Space)">▶</button>
    <button id="next" title="Next play (N)">⏭</button>
    <button id="toSnap" title="Jump to snap (S)">Snap</button>
    <button id="toThrow" title="Jump to throw (T)">Throw</button>
    <div id="timeline"><input id="scrub" type="range" min="0" value="0"><div id="marks"></div></div>
    <span id="clock" class="muted"></span>
    <span class="chips" id="speeds"></span>
  </div>
  <div class="row toggles">
    <span class="muted">Show:</span>
    <button data-o="names">Names</button>
    <button data-o="routes" class="on">Route chart</button>
    <button data-o="sep" class="on">Who's open</button>
    <button data-o="trails">Trails</button>
    <button data-o="full">Full field</button>
    <span class="muted kbd" style="margin-left:auto">Keys: Space play · ←/→ frame · S snap · T throw · N/P play</span>
  </div>
  <div id="results"></div>
</main>

<aside id="right">
  <div id="tabs"><button data-t="play" class="on">Play</button><button data-t="whatif">What-if</button><button data-t="defense">Defense</button></div>
  <div class="tab on" id="tab-play"><p class="muted">Pick a play from the list.</p></div>
  <div class="tab" id="tab-whatif"><p class="muted">Pick a play first, then change a route here and watch how the defense reacts.</p></div>
  <div class="tab" id="tab-defense"><p class="muted">Pick a play to see how this defense usually plays.</p></div>
</aside>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const cv = $('#field'), ctx = cv.getContext('2d');
const W = 53.3, DPR = window.devicePixelRatio || 1;
const COLORS = { ARI:'#97233F',ATL:'#A71930',BAL:'#5b3fb5',BUF:'#1f4fb0',CAR:'#0085CA',CHI:'#C83803',CIN:'#FB4F14',CLE:'#FF3C00',DAL:'#3f72c9',DEN:'#FB4F14',DET:'#0076B6',GB:'#2f7d4f',HOU:'#A71930',IND:'#2a6fd6',JAX:'#006778',KC:'#E31837',LA:'#2d55b5',LAC:'#0080C6',LV:'#8f969a',MIA:'#008E97',MIN:'#6b3fb0',NE:'#3a5a9a',NO:'#b39a5e',NYG:'#2a4aa0',NYJ:'#1d7a55',PHI:'#00707a',PIT:'#d9a000',SEA:'#4f9a1f',SF:'#AA0000',TB:'#D50A0A',TEN:'#4B92DB',WAS:'#a03a3a' };
const SNAP = ['ball_snap', 'autoevent_ballsnap'], END = ['pass_forward', 'autoevent_passforward', 'qb_sack', 'qb_strip_sack', 'run', 'fumble'];
const ORD = ['', 'st', 'nd', 'rd', 'th'];
const OL = ['T', 'G', 'C'];

let games = [], plays = [], shown = [], cur = null, frame = 0, playing = false, lastTick = 0, speed = 1;
let sel = null, hover = null, view = null, filter = 'All', offFilter = 'All', tab = 'play';
const show = { names: false, routes: true, sep: true, trails: false, full: false };
const wi = { target: null, edits: {}, drawing: false, cov: 'played', depth: 1, route: {} };
let sim = null, viewSim = false;

const api = p => fetch(p).then(r => r.json());
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const pct = (a, n) => Math.round(100 * a / Math.max(n, 1));
const last = n => (n || '').split(' ').slice(-1)[0];
const isTD = p => /TOUCHDOWN/.test(p.playDescription);

// ================= games & play list =================
api('/api/games').then(gs => {
  games = gs;
  $('#game').innerHTML = gs.map(g => `<option value="${g.gameId}">Week ${g.week} · ${g.visitorTeamAbbr} @ ${g.homeTeamAbbr}</option>`).join('');
  loadGame();
});
$('#game').onchange = loadGame;
$('#search').oninput = renderList;

const FILTERS = {
  All: () => true,
  '3rd down': p => p.down === 3,
  'Red zone': p => p.yardlineSide !== p.possessionTeam && p.yardlineNumber <= 20,
  'Big play 20+': p => p.playResult >= 20,
  TD: isTD,
  Sack: p => p.passResult === 'S',
  INT: p => p.passResult === 'IN',
  Incomplete: p => p.passResult === 'I',
};
$('#chips').innerHTML = Object.keys(FILTERS).map(k => `<button data-f="${k}" class="${k === filter ? 'on' : ''}">${k}</button>`).join('');
$('#chips').onclick = e => { if (e.target.dataset.f) { filter = e.target.dataset.f; $$('#chips button').forEach(b => b.classList.toggle('on', b === e.target)); renderList(); } };
$('#offChips').onclick = e => { if (e.target.dataset.f) { offFilter = e.target.dataset.f; $$('#offChips button').forEach(b => b.classList.toggle('on', b === e.target)); renderList(); } };

async function loadGame() {
  plays = (await api('/api/plays?game=' + $('#game').value)).sort((a, b) => a.quarter - b.quarter || b.gameClock.localeCompare(a.gameClock) || a.playId - b.playId);
  const g = games.find(g => g.gameId == $('#game').value);
  offFilter = 'All';
  $('#offChips').innerHTML = ['All', g.visitorTeamAbbr, g.homeTeamAbbr].map(t => `<button data-f="${t}" class="${t === 'All' ? 'on' : ''}">${t === 'All' ? 'Both offenses' : t + ' offense'}</button>`).join('');
  renderList();
  if (shown[0]) loadPlay(shown[0].playId);
}
function badge(p) {
  if (isTD(p)) return '<span class="badge td">TD</span>';
  if (p.passResult === 'IN') return '<span class="badge loss">INT</span>';
  if (p.passResult === 'S') return `<span class="badge loss">SACK ${p.playResult}</span>`;
  if (p.passResult === 'I' && !p.playResult) return '<span class="badge">INC</span>';
  const y = p.playResult;
  return `<span class="badge ${y >= 20 ? 'big' : y > 0 ? 'gain' : y < 0 ? 'loss' : ''}">${y > 0 ? '+' : ''}${y} yds</span>`;
}
function renderList() {
  const q = $('#search').value.toLowerCase();
  shown = plays.filter(p => FILTERS[filter](p) && (offFilter === 'All' || p.possessionTeam === offFilter) && (!q || JSON.stringify(p).toLowerCase().includes(q)));
  $('#count').textContent = `${shown.length} of ${plays.length} pass plays`;
  $('#plays').innerHTML = shown.map(p => `<div class="play ${cur?.play.playId === p.playId ? 'sel' : ''}" data-id="${p.playId}">
    <span class="meta">Q${p.quarter} ${p.gameClock} · ${p.down}${ORD[p.down]} & ${p.yardsToGo} · ${p.possessionTeam}</span>${badge(p)}
    <span class="d">${p.playDescription.replace(/^\(\d+:\d+\)\s*/, '')}</span></div>`).join('');
}
$('#plays').onclick = e => { const d = e.target.closest('.play'); if (d) loadPlay(+d.dataset.id); };

// ================= load + normalise a play (offense always attacks left → right) =================
async function loadPlay(id) {
  const data = await api(`/api/play?game=${$('#game').value}&play=${id}`);
  if (!data) return;
  const flip = data.dir === 'left';
  for (const e of data.ents) {
    for (let f = 0; f < data.nFrames; f++) e.f[f] ||= e.f[f - 1] || e.f.find(Boolean);
    if (flip) e.f = e.f.map(p => [120 - p[0], W - p[1], p[2], (p[3] + 180) % 360, (p[4] + 180) % 360]);
    e.off = e.team === data.play.possessionTeam;
  }
  cur = data;
  cur.los = flip ? 120 - data.play.absoluteYardlineNumber : data.play.absoluteYardlineNumber;
  const ev = Object.entries(cur.events).map(([f, e]) => [+f, e]);
  cur.S = ev.find(([, e]) => SNAP.includes(e))?.[0] ?? 0;
  cur.E = ev.find(([f, e]) => f > cur.S && END.includes(e))?.[0] ?? cur.nFrames - 1;
  cur.endEvent = cur.events[cur.E] || 'end';
  cur.tend = await api('/api/team?t=' + cur.play.defensiveTeam);
  sel = hover = null; wi.target = null; wi.edits = {}; wi.route = {}; wi.drawing = false; wi.cov = 'played'; sim = null; viewSim = false;
  frame = 0; playing = true;
  computeView(); renderList(); renderBoard(); renderPlayTab(); renderDefenseTab(); renderWhatIf(); renderMarks(); updateModeBadge(); draw();
  $('#empty').hidden = true;
  $('#toThrow').textContent = /sack/.test(cur.endEvent) ? 'Sack' : 'Throw';
}
function step(d) { const i = shown.findIndex(p => p.playId === cur?.play.playId); const p = shown[i + d]; if (p) { loadPlay(p.playId); $(`.play[data-id="${p.playId}"]`)?.scrollIntoView({ block: 'nearest' }); } }

// ================= header scoreboard =================
function renderBoard() {
  const p = cur.play, g = games.find(g => g.gameId === p.gameId);
  const t = (abbr, score) => `<span class="team ${abbr === p.possessionTeam ? 'poss' : ''}"><i style="background:${COLORS[abbr]}"></i>${abbr} <b>${score}</b></span>`;
  $('#board').innerHTML = t(g.visitorTeamAbbr, p.preSnapVisitorScore) + t(g.homeTeamAbbr, p.preSnapHomeScore) +
    `<span class="sit">Q${p.quarter} · ${p.gameClock}</span><span class="sit"><em>${p.down}${ORD[p.down]} & ${p.yardsToGo}</em> · ball on ${p.yardlineSide || ''} ${p.yardlineNumber}</span>
     <span class="sit">${p.possessionTeam} ball →</span>`;
}

// ================= right panel: Play =================
function renderPlayTab() {
  const p = cur.play;
  const pressure = cur.ents.filter(e => e.hit || e.hurry || e.sack).map(e => `#${e.jersey} ${e.name} (${[e.sack && 'sack', e.hit && 'hit', e.hurry && 'hurry'].filter(Boolean).join(', ')})`);
  const beaten = cur.ents.filter(e => e.beaten).map(e => `#${e.jersey} ${e.name}`);
  const rushers = cur.ents.filter(e => e.role === 'Pass Rush').length;
  const tt = ((cur.E - cur.S) / 10).toFixed(1);
  $('#tab-play').innerHTML = `<div class="desc">${p.playDescription}</div>
    <h3>Pre-snap</h3><div class="facts">
      <span>Formation</span><span>${p.offenseFormation || '-'} · ${p.personnelO || '-'}</span>
      <span>Defense</span><span>${p.personnelD || '-'} · ${p.defendersInBox ?? '-'} in the box</span>
      <span>Coverage</span><span><b>${p.pff_passCoverage || '-'}</b> (${p.pff_passCoverageType || '-'})</span></div>
    <h3>The rep</h3><div class="facts">
      <span>Dropback</span><span>${(p.dropBackType || '-').toLowerCase().replace(/_/g, ' ')}${p.pff_playAction ? ' · play action' : ''}</span>
      <span>Rushers</span><span>${rushers}${rushers >= 5 ? ' (blitz)' : ''}</span>
      <span>Time to ${/sack/.test(cur.endEvent) ? 'sack' : 'throw'}</span><span>${tt}s ${tt < 2.5 ? '<span class="good">quick</span>' : tt > 3.2 ? '<span class="warn">long hold</span>' : ''}</span>
      <span>Pressure</span><span>${pressure.join('<br>') || '<span class="good">clean pocket</span>'}</span>
      ${beaten.length ? `<span>Beaten blocks</span><span class="bad">${beaten.join('<br>')}</span>` : ''}</div>
    <div id="pcard"></div>`;
  renderPlayerCard();
}
function renderPlayerCard() {
  const el = $('#pcard'); if (!el) return;
  const e = cur?.ents.find(e => e.id === sel);
  if (!e) { el.innerHTML = '<p class="muted" style="margin-top:14px">Tip: click any player on the field for his details.</p>'; return; }
  const p = pos(e, frame), max = Math.max(...e.f.map(f => f[2]));
  const blocked = cur.ents.find(x => x.id == e.blocked), s = separation(e, frame);
  el.innerHTML = `<div class="card"><b style="font-size:15px">#${e.jersey} ${e.name}</b> <span class="muted">${e.pos} · ${e.team}</span>
    <div class="facts" style="margin-top:6px">
    <span>Job</span><span>${e.role || '-'} (lined up ${e.lined || '-'})</span>
    <span>Speed</span><span>${(p[2] * 2.045).toFixed(1)} mph now · top ${(max * 2.045).toFixed(1)} mph</span>
    <span>Nearest opponent</span><span>${s?.toFixed(1) ?? '-'} yds</span>
    ${blocked ? `<span>Blocking</span><span>#${blocked.jersey} ${blocked.name}${e.beaten ? ' <span class="bad">(beaten)</span>' : ''}</span>` : ''}</div></div>`;
}

// ================= right panel: Defense tendencies =================
function renderDefenseTab() {
  const p = cur.play, b = cur.tend.all, d = cur.tend.byDown[p.down] || b;
  const covs = Object.entries(b.cov).sort((a, c) => c[1] - a[1]);
  $('#tab-defense').innerHTML = `<div class="headline">${p.defensiveTeam} defense</div><p class="muted" style="margin:2px 0 0">${b.n} pass plays, weeks 1–8 of 2021</p>
    <div class="card"><div class="facts">
      <span>Man / zone</span><span><b>${pct(b.man, b.n)}%</b> man · <b>${pct(b.zone, b.n)}%</b> zone</span>
      <span>On ${p.down}${ORD[p.down]} down</span><span>${pct(d.man, d.n)}% man (${d.n} plays)</span>
      <span>Rushers</span><span>${(b.rush / b.n).toFixed(1)} on average</span>
      <span>Blitz rate</span><span>${pct(b.blitz, b.n)}% bring 5+</span>
      <span>Box</span><span>${(b.box / b.n).toFixed(1)} defenders on average</span></div></div>
    <h3>Coverage calls (this play highlighted)</h3>` +
    covs.map(([c, n]) => `<div class="barrow ${c === p.pff_passCoverage ? 'this' : ''}"><span>${c}</span><i><b style="width:${pct(n, covs[0][1])}%"></b></i><span>${pct(n, b.n)}%</span></div>`).join('');
}

// ================= camera =================
function computeView() {
  if (show.full || !cur) { view = { x0: -2, y0: -3.35, w: 124 }; return; }
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const e of cur.ents) if (e.id !== 'ball') for (const p of e.f) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  const w = Math.min(124, Math.max(44, x1 - x0 + 14, (y1 - y0 + 8) * 2)), h = w / 2;
  const cx = Math.max(w / 2 - 2, Math.min(122 - w / 2, (x0 + x1) / 2)), cy = h >= W + 6 ? W / 2 : Math.max(h / 2 - 3, Math.min(W + 3 - h / 2, (y0 + y1) / 2));
  view = { x0: cx - w / 2, y0: cy - h / 2, w };
}
function resize() { cv.width = cv.clientWidth * DPR; cv.height = cv.width / 2; draw(); }
new ResizeObserver(resize).observe(cv);
const k = () => cv.width / view.w;

// any change re-simulates and replays from the snap

  const active = Object.values(wi.edits).some(p => p.length) || wi.cov !== 'played';
  sim = active ? simulate() : null; viewSim = !!sim;
  updateModeBadge(); renderMarks(); renderWhatIf();

}
function updateModeBadge() {

}

    <div class="headline" style="margin:6px 0">Best read: #${best.e.jersey} ${best.e.name}, ${best.now.toFixed(1)} yds open</div>

// ================= the what-if engine =================
// Offense: edited players run the new route (accelerate, slow down at cuts). Everyone else keeps real tracking.
// Defense: each cover defender is tied to the receiver he shadowed most in the real play.
//  - same coverage as played: real track + reaction to the edited receiver (man: full, zone: only near his area)
//  - forced man: trail the assigned receiver, closing the snap cushion
//  - forced zone: drop to a landmark and break on whichever receiver enters the area
// Movement is capped by each defender's real top speed, 7 yd/s² accel and a 0.3s reaction delay.
// ponytail: hand-tuned reaction rules, swap for a model trained on the tracking data if accuracy matters.
const LAG = 3, DT = 0.1, AMAX = 7;
function simulate() {
  const { S, E, los } = cur, edits = Object.fromEntries(Object.entries(wi.edits).filter(([, p]) => p.length));
  const played = cur.play.pff_passCoverageType;
  const mode = wi.cov === 'played' ? played : wi.cov === 'tendency' ? covOptions()[1][1].split(': ')[1] : wi.cov;
  const off = cur.ents.filter(e => e.off && e.id !== 'ball');
  const cover = cur.ents.filter(e => !e.off && e.role === 'Coverage');
  const routes = off.filter(e => e.role === 'Pass Route' || edits[e.id]);
  const out = { pos: {}, mode };

  for (const e of off) {
    const pts = edits[e.id]; if (!pts) continue;
    const track = e.f.slice(0, S + 1), top = Math.max(7, ...e.f.map(f => f[2]));
    let p = e.f[S].slice(0, 2), v = e.f[S][2], i = 0;
    for (let f = S + 1; f <= E; f++) {
      v = Math.min(top, v + 5 * DT);
      let stepLen = v * DT;
      while (stepLen > 0 && i < pts.length) {
        const d = dist(p, pts[i]);
        if (d > stepLen) { p = [p[0] + (pts[i][0] - p[0]) * stepLen / d, p[1] + (pts[i][1] - p[1]) * stepLen / d]; stepLen = 0; }
        else {
          stepLen -= d; p = pts[i].slice(); i++;
          if (i < pts.length) { const a = pts[i - 2] || e.f[S], prev = Math.atan2(p[0] - a[0], p[1] - a[1]), next = Math.atan2(pts[i][0] - p[0], pts[i][1] - p[1]);
            let turn = Math.abs(next - prev); if (turn > Math.PI) turn = 2 * Math.PI - turn; v *= 1 - 0.55 * turn / Math.PI; }
        }
      }
      if (i >= pts.length) v = Math.max(0, v - 8 * DT);
      const q = track[f - 1], h = (Math.atan2(p[0] - q[0], p[1] - q[1]) * 180 / Math.PI + 360) % 360;
      track[f] = [p[0], p[1], v, h, h];
    }
    out.pos[e.id] = track;
  }
  const R = (e, f) => (out.pos[e.id] || e.f)[Math.max(S, f)];

  const assign = {};
  for (const d of cover) {
    let best = null, bestD = Infinity;
    for (const r of routes) { let s = 0; for (let f = S; f <= E; f++) s += dist(d.f[f], r.f[f]); if (s < bestD) { bestD = s; best = r; } }
    assign[d.id] = best;
  }
  const editedEnts = Object.keys(edits).map(id => cur.ents.find(e => e.id === id));

  for (const d of cover) {
    const a = assign[d.id]; if (!a) continue;
    const sameMode = mode === played || (played !== 'Man' && played !== 'Zone');
    if (sameMode && mode === 'Man' && !edits[a.id]) continue;
    if (sameMode && mode !== 'Man' && !editedEnts.some(r => { for (let f = S; f <= E; f++) if (dist(R(r, f), d.f[f]) < 10) return true; })) continue;
    const top = Math.max(6, ...d.f.map(f => f[2])) * 1.03;
    const snapOff = [d.f[S][0] - a.f[S][0], d.f[S][1] - a.f[S][1]], snapDepth = Math.abs(d.f[S][0] - los);
    const land = [los + (snapDepth > 9 ? Math.max(snapDepth, 14) : 8), d.f[S][1]];
    const track = d.f.slice(0, S + 1), p0 = d.f[Math.max(0, S - 1)];
    let p = d.f[S].slice(0, 2), vel = [(d.f[S][0] - p0[0]) / DT, (d.f[S][1] - p0[1]) / DT];
    for (let f = S + 1; f <= E; f++) {
      const t = f - S, lf = f - LAG;
      let tgt;
      if (sameMode && mode === 'Man') { const n = R(a, lf), o = a.f[Math.max(S, lf)]; tgt = [d.f[f][0] + n[0] - o[0], d.f[f][1] + n[1] - o[1]]; }
      else if (sameMode) {
        tgt = d.f[f].slice(0, 2);
        for (const r of editedEnts) { const n = R(r, lf), o = r.f[Math.max(S, lf)], w = Math.max(0, Math.min(1, 1 - (dist(n, d.f[f]) - 3) / 7));
          tgt = [tgt[0] + w * (n[0] - o[0]), tgt[1] + w * (n[1] - o[1])]; }
      } else if (mode === 'Man') { const n = R(a, lf), c = Math.max(0.15, 1 - t / 20); tgt = [n[0] + snapOff[0] * c, n[1] + snapOff[1] * c]; }
      else {
        const c = Math.min(1, t / 15), anchor = [d.f[S][0] + (land[0] - d.f[S][0]) * c, d.f[S][1] + (land[1] - d.f[S][1]) * c];
        let near = null, nd = 7; for (const r of routes) { const q = R(r, lf), dd = dist(q, anchor); if (dd < nd) { nd = dd; near = q; } }
        tgt = near ? [anchor[0] + (near[0] - anchor[0]) * 0.8, anchor[1] + (near[1] - anchor[1]) * 0.8] : anchor;
      }
      const dx = tgt[0] - p[0], dy = tgt[1] - p[1], dd = Math.hypot(dx, dy) || 1e-6;
      const want = Math.min(top, dd / 0.3), dv = [dx / dd * want - vel[0], dy / dd * want - vel[1]], dm = Math.hypot(...dv);
      if (dm > AMAX * DT) { dv[0] *= AMAX * DT / dm; dv[1] *= AMAX * DT / dm; }
      vel = [vel[0] + dv[0], vel[1] + dv[1]]; p = [p[0] + vel[0] * DT, p[1] + vel[1] * DT];
      const s = Math.hypot(...vel), h = (Math.atan2(vel[0], vel[1]) * 180 / Math.PI + 360) % 360;
      track[f] = [p[0], p[1], s, h, h];
    }
    out.pos[d.id] = track;
  }
  return out;
}
